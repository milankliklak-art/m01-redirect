<!DOCTYPE html>
<!-- Dopuna 28.10.2026: regali R, police P i podne zone PZ; Brzi prijem zadržan. -->
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Evidencija paleta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      color: #222;
    }
    .card {
      max-width: 520px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 24px; }
    .lokacija {
      font-size: 24px;
      font-weight: bold;
      padding: 14px;
      background: #eee;
      border-radius: 10px;
      margin: 18px 0;
    }
    .napomena { color: #555; line-height: 1.45; margin-bottom: 18px; }
    .dugme {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px;
      margin-top: 14px;
      border-radius: 10px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      border: 0;
      cursor: pointer;
    }
    .greska {
      background: #ffe3e3;
      color: #9c0000;
      padding: 14px;
      border-radius: 10px;
      margin-top: 16px;
      display: none;
    }
    .malaNapomena {
      margin-top: 12px;
      color: #777;
      font-size: 13px;
      line-height: 1.4;
    }
    @media (max-width: 700px) {
      html, body { min-height: 100%; background: #fff; }
      body { padding: 0; }
      .card {
        box-sizing: border-box;
        max-width: none;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="naslov">EVIDENCIJA PALETA</h1>
    <div id="lokacija" class="lokacija">...</div>
    <div id="napomena" class="napomena">
      Klikni na dugme ispod da otvoriš Evidenciju paleta.
    </div>
    <a id="appBtn" class="dugme" href="#">OTVORI EVIDENCIJU PALETA</a>
    <div class="malaNapomena">Aplikacija će se otvoriti direktno u Firefox-u.</div>
    <div id="greska" class="greska"></div>
  </div>

  <script>
    const APP_BASE =
      'https://script.google.com/macros/s/AKfycbz7bSlu0DTMq09mmPiQ0X0unUIQg6NgKOUV5QZLFzj0ma0ccf5ROK7qUAbO5hrHmb5WUQ/exec';

    const params = new URLSearchParams(window.location.search);
    const lokacija = (params.get('lokacija') || '').trim().toUpperCase();
    const brziId = (params.get('brziId') || '').trim();
    const lokacijaDiv = document.getElementById('lokacija');
    const appBtn = document.getElementById('appBtn');
    const greska = document.getElementById('greska');
    const napomena = document.getElementById('napomena');
    const BRZI_LOKACIJA_KEY = 'm01_brzi_prijem_lokacija_v1';
    const BRZI_ARTIKAL_KEY = 'm01_brzi_prijem_artikal_v1';
    const BRZI_LOKACIJA_MAX_MS = 15 * 60 * 1000;
    const BRZI_ARTIKAL_MAX_MS = 15 * 60 * 1000;

    // Regali R i police P sa nivoima A-D; podne zone M03: 4 reda, po 6 zona.
    function validnaLokacijaZaPreusmeravanje(vrednost) {
      return /^(M1|M2|M3|M01|M02|M03)-[A-Z0-9]+-[RP][0-9]+-[A-D][0-9]+$/.test(vrednost) ||
        /^M03-A0[1-4]-PZ0[1-6]$/.test(vrednost);
    }
    const validnaLokacija = validnaLokacijaZaPreusmeravanje(lokacija);
    const validanBrziId = /^\d+$/.test(brziId);

    function sacuvajLokacijuZaBrziPrijem(vrednost) {
      try {
        localStorage.setItem(BRZI_LOKACIJA_KEY, JSON.stringify({
          lokacija: vrednost,
          vreme: Date.now()
        }));
      } catch (e) {}
    }

    function ucitajLokacijuZaBrziPrijem() {
      try {
        const raw = localStorage.getItem(BRZI_LOKACIJA_KEY);
        if (!raw) return '';

        const podatak = JSON.parse(raw);
        const vrednost = String(podatak && podatak.lokacija || '').trim().toUpperCase();
        const vreme = Number(podatak && podatak.vreme || 0);

        if (!validnaLokacijaZaPreusmeravanje(vrednost) ||
            !vreme || Date.now() - vreme > BRZI_LOKACIJA_MAX_MS) {
          localStorage.removeItem(BRZI_LOKACIJA_KEY);
          return '';
        }

        return vrednost;
      } catch (e) {
        return '';
      }
    }

    function obrisiLokacijuZaBrziPrijem() {
      try {
        localStorage.removeItem(BRZI_LOKACIJA_KEY);
      } catch (e) {}
    }

    function sacuvajArtikalZaBrziPrijem(vrednost) {
      if (!/^\d+$/.test(String(vrednost || '').trim())) return;
      try {
        localStorage.setItem(BRZI_ARTIKAL_KEY, JSON.stringify({
          id: String(vrednost).trim(),
          vreme: Date.now()
        }));
      } catch (e) {}
    }

    function ucitajArtikalZaBrziPrijem() {
      try {
        const raw = localStorage.getItem(BRZI_ARTIKAL_KEY);
        if (!raw) return '';
        const podatak = JSON.parse(raw);
        const id = String(podatak && podatak.id || '').trim();
        const vreme = Number(podatak && podatak.vreme || 0);
        if (!/^\d+$/.test(id) || !vreme || Date.now() - vreme > BRZI_ARTIKAL_MAX_MS) {
          localStorage.removeItem(BRZI_ARTIKAL_KEY);
          return '';
        }
        return id;
      } catch (e) {
        return '';
      }
    }

    function obrisiArtikalZaBrziPrijem() {
      try {
        localStorage.removeItem(BRZI_ARTIKAL_KEY);
      } catch (e) {}
    }

    if ((lokacija && !validnaLokacija) || (brziId && !validanBrziId)) {
      lokacijaDiv.textContent = lokacija;
      appBtn.style.display = 'none';
      napomena.style.display = 'none';
      greska.style.display = 'block';
      greska.textContent = lokacija && !validnaLokacija
        ? 'Neispravna lokacija. Dozvoljeni su regali R i police P sa nivoima A-D, kao i podne zone M03-A01-PZ01 do M03-A04-PZ06.'
        : 'Neispravan Merchant ID artikla.';
    } else {
      if (validanBrziId) sacuvajArtikalZaBrziPrijem(brziId);
      const zapamcenArtikalZaLokaciju = validnaLokacija
        ? ucitajArtikalZaBrziPrijem()
        : '';

      if (validnaLokacija) {
        sacuvajLokacijuZaBrziPrijem(lokacija);
        const magacin = lokacija.split('-')[0];
        lokacijaDiv.textContent = zapamcenArtikalZaLokaciju
          ? lokacija + ' · ID ARTIKLA: ' + zapamcenArtikalZaLokaciju
          : lokacija;
        document.getElementById('naslov').textContent = zapamcenArtikalZaLokaciju
          ? 'BRZI PRIJEM ARTIKLA'
          : magacin + ' - EVIDENCIJA PALETA';
        if (zapamcenArtikalZaLokaciju) {
          napomena.textContent = 'Artikal i lokacija su povezani. Otvori Brzi prijem i unesi količinu.';
          appBtn.textContent = 'OTVORI BRZI PRIJEM';
        }
      } else if (validanBrziId) {
        const zapamcenaLokacija = ucitajLokacijuZaBrziPrijem();

        if (!zapamcenaLokacija) {
          lokacijaDiv.textContent = 'ID ARTIKLA: ' + brziId;
          document.getElementById('naslov').textContent = 'BRZI PRIJEM ARTIKLA';
          napomena.textContent = 'Artikal je zapamćen. Otvori aplikaciju, a zatim skeniraj QR kod paletne lokacije.';
        } else {
          lokacijaDiv.textContent = zapamcenaLokacija + ' · ID ARTIKLA: ' + brziId;
        }
        document.getElementById('naslov').textContent = 'BRZI PRIJEM ARTIKLA';
        napomena.textContent = 'Klikni na dugme ispod da otvoriš Brzi prijem.';
        appBtn.textContent = 'OTVORI BRZI PRIJEM';
      } else {
        // Shortcut bez lokacije: otvara istu aplikaciju bez ?lokacija= parametra.
        lokacijaDiv.style.display = 'none';
        document.getElementById('naslov').textContent = 'EVIDENCIJA PALETA';
      }

      const zapamcenaLokacijaZaArtikal = validanBrziId ? ucitajLokacijuZaBrziPrijem() : '';
      const query = validnaLokacija
        ? '?lokacija=' + encodeURIComponent(lokacija) +
          (zapamcenArtikalZaLokaciju
            ? '&brziId=' + encodeURIComponent(zapamcenArtikalZaLokaciju)
            : '')
        : (validanBrziId
          ? (zapamcenaLokacijaZaArtikal
            ? '?lokacija=' + encodeURIComponent(zapamcenaLokacijaZaArtikal) +
              '&brziId=' + encodeURIComponent(brziId)
            : '?brziId=' + encodeURIComponent(brziId))
          : '');

      const webUrl = APP_BASE + query;

      const intentPutanja =
        'script.google.com/macros/s/AKfycbz7bSlu0DTMq09mmPiQ0X0unUIQg6NgKOUV5QZLFzj0ma0ccf5ROK7qUAbO5hrHmb5WUQ/exec' + query;

      const firefoxIntent =
        'intent://' + intentPutanja +
        '#Intent;' +
        'scheme=https;' +
        'package=org.mozilla.firefox;' +
        'S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';' +
        'end';

      if (query) {
        appBtn.href = firefoxIntent;
      }

      if (validanBrziId && zapamcenaLokacijaZaArtikal) {
        appBtn.addEventListener('click', function() {
          obrisiLokacijuZaBrziPrijem();
        });
      }

      if (validnaLokacija && zapamcenArtikalZaLokaciju) {
        appBtn.addEventListener('click', function() {
          obrisiArtikalZaBrziPrijem();
        });
      }
    }
  </script>
</body>
</html>
