<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magacinska aplikacija</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      max-width: 520px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .lokacija {
      font-size: 24px;
      font-weight: bold;
      padding: 14px;
      background: #eee;
      border-radius: 10px;
      margin: 18px 0;
    }

    .napomena {
      color: #555;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .dugme {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px;
      margin-top: 14px;
      border-radius: 10px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      border: 0;
      cursor: pointer;
    }

    .greska {
      background: #ffe3e3;
      color: #9c0000;
      padding: 14px;
      border-radius: 10px;
      margin-top: 16px;
      display: none;
    }

    .malaNapomena {
      margin-top: 12px;
      color: #777;
      font-size: 13px;
      line-height: 1.4;
    }
  

    @media (max-width: 700px) {
      html, body { min-height: 100%; background: #fff; }
      body { padding: 0; }
      .card {
        box-sizing: border-box;
        max-width: none;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

<div class="card">

  <h1 id="naslov">MAGACIN</h1>

  <div id="lokacija" class="lokacija">...</div>

  <div id="napomena" class="napomena">
    Klikni na dugme ispod da otvoriš magacinsku aplikaciju.
  </div>

  <a id="appBtn" class="dugme" href="#">
    OTVORI MAGACINSKU APLIKACIJU
  </a>

  <div class="malaNapomena">
    Aplikacija će se otvoriti u preporučenom browseru za rad u magacinu.
  </div>

  <div id="greska" class="greska"></div>

</div>

<script>
  const APP_BASE =
    'https://script.google.com/macros/s/AKfycbz7bSlu0DTMq09mmPiQ0X0unUIQg6NgKOUV5QZLFzj0ma0ccf5ROK7qUAbO5hrHmb5WUQ/exec';

  const params = new URLSearchParams(window.location.search);
  const lokacija = (params.get('lokacija') || '').trim().toUpperCase();

  const lokacijaDiv = document.getElementById('lokacija');
  const appBtn = document.getElementById('appBtn');
  const greska = document.getElementById('greska');
  const napomena = document.getElementById('napomena');

  const validnaLokacija = /^M0[123]-[A-Z0-9]+-R[0-9]+-[A-D][0-9]+$/.test(lokacija);

  if (lokacija && !validnaLokacija) {
    lokacijaDiv.textContent = lokacija;
    appBtn.style.display = 'none';
    napomena.style.display = 'none';
    greska.style.display = 'block';
    greska.textContent = 'Neispravna lokacija M01/M02/M03.';
  } else {
    if (validnaLokacija) {
      lokacijaDiv.textContent = lokacija;
      document.getElementById('naslov').textContent = lokacija.substring(0, 3) + ' - MAGACIN';
    } else {
      // Shortcut bez lokacije: otvara istu aplikaciju bez ?lokacija= parametra.
      lokacijaDiv.style.display = 'none';
      document.getElementById('naslov').textContent = 'MAGACINSKA APLIKACIJA';
    }

    const webUrl = validnaLokacija
      ? APP_BASE + '?lokacija=' + encodeURIComponent(lokacija)
      : APP_BASE;

    const intentPutanja =
      'script.google.com/macros/s/AKfycbz7bSlu0DTMq09mmPiQ0X0unUIQg6NgKOUV5QZLFzj0ma0ccf5ROK7qUAbO5hrHmb5WUQ/exec' +
      (validnaLokacija ? '?lokacija=' + encodeURIComponent(lokacija) : '');

    const firefoxIntent =
      'intent://' + intentPutanja +
      '#Intent;' +
      'scheme=https;' +
      'package=org.mozilla.firefox;' +
      'S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';' +
      'end';

    appBtn.href = firefoxIntent;
  }
</script>

</body>
</html>
